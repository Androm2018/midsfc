name: Update fixtures, results & table

on:
  schedule:
    # Times are UTC. Local (UK) time is UTC+1 in summer, UTC+0 in winter.
    - cron: "0 17 * * 6"   # Saturday ~6pm local — after 2pm kick-offs
    - cron: "30 21 * * *"  # Every night ~10:30pm local — catches midweek games
  workflow_dispatch:        # "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch SOSL data and update index.html
        run: python3 scripts/update_site_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "mids-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "Auto-update results, fixtures & table"
            git push
          fi
